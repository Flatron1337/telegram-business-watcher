[project]
name = "business-bot"
version = "0.1.0"
description = "Telegram Business secretary bot for tracking deleted and edited messages"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "aiogram>=3.17.0",
    "aiosqlite>=0.21.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.7.0",
    "aiohttp>=3.10.0",
    "redis>=5.0.0",
    "telethon>=1.45.0",
]

[dependency-groups]
dev = [
    "hypothesis>=6.170.12",
    "pytest>=9.1.1",
    "ruff>=0.17.2",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
